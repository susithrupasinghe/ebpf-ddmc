# EDDMC Daemon Configuration
# ----------------------------
# Edit this file or pass --config=/path/to/custom.yaml on startup.

daemon:
  # Seconds between each detection scan cycle
  scan_interval: 5

  # Write PID file here for systemd / init integration
  pid_file: /var/run/eddmc.pid

  # Log level: DEBUG | INFO | WARNING | ERROR
  log_level: INFO

  # Log file path (empty = stderr only)
  log_file: /var/log/eddmc/eddmc.log

  # Unix socket for UI / CLI IPC
  socket_path: /tmp/eddmc.sock

detection:
  # Minimum score to generate an alert (0-100)
  alert_threshold: 20

  # Minimum score to apply throttle
  throttle_threshold: 40

  # Minimum score to apply network block
  block_threshold: 60

  # Minimum score to suspend/terminate
  terminate_threshold: 80

  # Minimum number of syscalls before scoring (avoids FP on new short-lived procs)
  min_syscalls: 500

  # Minimum seconds a process must exist before being scored
  min_age_seconds: 10

  # Hard-evidence score floors -- a confirmed signal here overrides a lower
  # weighted-sum score rather than being diluted by other low-scoring features
  pool_floor: 50         # confirmed stratum pool connection -> never below MEDIUM
  scratchpad_floor: 45   # RandomX scratchpad signature + high CPU -> never below MEDIUM

  # Known-benign processes exempted from scoring entirely. Some legitimate
  # multi-threaded dev tools (Node/Bun/Electron-based apps under sustained
  # CPU load) can otherwise trip the same futex/thread-saturation signals as
  # a real miner. Machine-specific entries belong in local.yaml, not here.
  #
  # allowlist_binaries: {path, sha256} pairs. Path alone is not trusted --
  # every match re-hashes /proc/<pid>/exe and compares; a path match with a
  # DIFFERENT hash is treated as a tamper signal, not silently allowlisted
  # (an allowlisted binary's content changing is a classic supply-chain-
  # compromise pattern, e.g. malware overwriting a trusted, user-writable
  # binary). Every thread of a process shares the same exe path, so this
  # correctly exempts a whole multi-threaded app even though its worker
  # threads each report a different `comm` (e.g. "Bun Pool 0", "HeapHelper").
  # POST /api/config/detection {"allowlist_paths": [...]} hashes and adds
  # entries for you rather than requiring a hash be computed by hand.
  allowlist_binaries: []

  # allowlist_comm: process/thread name match. Weaker than allowlist_binaries
  # -- trivially spoofable (a miner can rename its own binary to match), it
  # only matches the exact `comm` string so it won't cover a multi-threaded
  # app's *other* worker threads, and it has no hash-pinning equivalent since
  # a process name isn't a file to hash. Offered for convenience only.
  allowlist_comm: []

  # Per-feature scoring weights. Any key omitted here falls back to the
  # built-in default in daemon/detector/scorer.py -- you only need to list
  # the weights you want to change, not all of them.
  weights:
    futex_strong: 18          # futex_ratio >= 0.40
    futex_moderate: 9         # futex_ratio >= 0.20
    compute_pure: 10          # io_ratio < 0.02 AND cpu > 70%
    thread_full_sat: 12       # thread_count >= cpu_count
    thread_partial_sat: 6     # thread_count >= 0.6 x cpu_count
    cpu_high: 6               # cpu_percent >= 85%
    scratchpad_exact: 15      # 2MB scratchpad-sized alloc AND MAP_HUGETLB together (strong, floor-eligible)
    scratchpad_weak: 3        # 2MB-sized alloc alone, no huge-page flag (weak, not floor-eligible)
    huge_pages: 5             # MAP_HUGETLB requested (any size)
    cpu_bound_strong: 12      # involuntary preemption ratio >= 0.92
    cpu_bound_moderate: 6     # involuntary preemption ratio >= 0.75
    sustained_medium: 7       # suspicious for >= 3 consecutive scan windows
    sustained_high: 14        # suspicious for >= 6 consecutive scan windows
    pool_connection: 40       # confirmed stratum port TCP connection

mitigation:
  # If false: suspend only, operator must confirm kill
  auto_kill: false

  # Perform all mitigation steps but do not actually apply them
  dry_run: false

  # Cgroups v2 root (must be mounted)
  cgroup_root: /sys/fs/cgroup/eddmc

  # CPU quota percentages per confidence tier
  throttle_quotas:
    MEDIUM:   30
    HIGH:     10
    CRITICAL:  5

  # Grace period (seconds) between SIGTERM and SIGKILL
  sigterm_grace: 3

ui:
  # Port for the Electron UI to connect over HTTP (JSON API)
  api_port: 7373
  # Enable CORS for localhost Electron window
  allow_localhost: true

fingerprint_registry:
  # Opt-in only -- disabled by default. No data leaves the host unless an
  # administrator explicitly enables this (see thesis S3.12 ethics chapter).
  enabled: false

  # Central registry server (FastAPI + SQLite, see registry/).
  # Defaults to a locally-simulated registry for development; point this
  # at a real second node's address for a genuine cross-host experiment.
  registry_url: http://127.0.0.1:8321

  # Cosine-similarity threshold for elevating a new process to HIGH tier
  similarity_threshold: 0.85

  # How often the matcher re-downloads the confirmed fingerprint set
  refresh_interval_hours: 1

  # Confirmation gate: minimum continuous seconds at CRITICAL before a
  # fingerprint may be packaged and submitted
  sustained_critical_seconds: 60

  # Separate opt-in: sync the registry's admin-confirmed allowlist (known-
  # good binary hashes -- see detection.allowlist_binaries) to reduce false
  # positives fleet-wide. Independent of `enabled` above, which governs the
  # miner-fingerprint (detection-acceleration) channel -- both share
  # registry_url, but a node can use one channel without the other.
  # Unlike the fingerprint channel, this one has NO auto-confirm mode at
  # all: every submission (via `eddmc allowlist submit`) sits pending until
  # a registry admin explicitly confirms it, since a poisoned allowlist
  # entry would make every syncing node blind to that exact binary.
  sync_allowlist: false
