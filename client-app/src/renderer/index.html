<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDDMC — CPU Cryptojacking Detection</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f172a;
      --surface:   #1e293b;
      --border:    #334155;
      --text:      #e2e8f0;
      --muted:     #94a3b8;
      --accent:    #38bdf8;
      --green:     #22c55e;
      --yellow:    #facc15;
      --orange:    #fb923c;
      --red:       #ef4444;
      --critical:  #dc2626;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      height: 52px;
      flex-shrink: 0;
    }
    header h1 { font-size: 18px; font-weight: 700; color: var(--accent); }
    header h1 span { color: var(--muted); font-weight: 400; font-size: 13px; }

    #daemon-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    #status-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--red);
      transition: background .3s;
    }
    #status-dot.online { background: var(--green); }

    /* ── Nav tabs ─────────────────────────────────────────────────────── */
    nav {
      display: flex;
      gap: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    nav button {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      padding: 10px 20px;
      transition: color .2s, border-color .2s;
    }
    nav button.active, nav button:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── Main panels ──────────────────────────────────────────────────── */
    main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

    .panel { display: none; flex: 1; overflow: auto; padding: 16px 20px; }
    .panel.active { display: flex; flex-direction: column; gap: 16px; }

    /* ── Stat cards ───────────────────────────────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .stat-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .stat-card .value { font-size: 26px; font-weight: 700; margin-top: 4px; }
    .stat-card.critical .value { color: var(--critical); }
    .stat-card.high     .value { color: var(--orange); }
    .stat-card.medium   .value { color: var(--yellow); }
    .stat-card.ok       .value { color: var(--green); }

    /* ── Process table ────────────────────────────────────────────────── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      flex: 1;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: #0f172a;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 10px 14px;
      text-align: left;
      position: sticky;
      top: 0;
    }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(56,189,248,.05); }
    tbody td { padding: 9px 14px; font-size: 13px; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
    }
    .badge-CRITICAL { background: rgba(220,38,38,.2);  color: var(--critical); }
    .badge-HIGH     { background: rgba(251,146,60,.2); color: var(--orange); }
    .badge-MEDIUM   { background: rgba(250,204,21,.2); color: var(--yellow); }
    .badge-LOW      { background: rgba(56,189,248,.15);color: var(--accent); }
    .badge-NONE     { background: rgba(148,163,184,.1);color: var(--muted); }

    .score-bar-wrap { display: flex; align-items: center; gap: 8px; }
    .score-bar {
      width: 80px; height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .score-bar-fill { height: 100%; border-radius: 3px; transition: width .4s; }

    .btn-sm {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      padding: 3px 8px;
      transition: border-color .2s, color .2s;
    }
    .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm.danger:hover { border-color: var(--red); color: var(--red); }

    /* ── Alert list ───────────────────────────────────────────────────── */
    .alert-list { display: flex; flex-direction: column; gap: 8px; }
    .alert-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
    }
    .alert-item.CRITICAL { border-left-color: var(--critical); }
    .alert-item.HIGH     { border-left-color: var(--orange); }
    .alert-item.MEDIUM   { border-left-color: var(--yellow); }
    .alert-item.LOW      { border-left-color: var(--accent); }

    .alert-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .alert-time { font-size: 11px; color: var(--muted); margin-left: auto; }
    .alert-reasons { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .alert-reasons li { list-style: none; }
    .alert-reasons li::before { content: "• "; }

    /* ── Config view ──────────────────────────────────────────────────── */
    .config-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .config-block pre {
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 12px;
      color: var(--text);
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    /* ── Footer ───────────────────────────────────────────────────────── */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px 20px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<header>
  <h1>EDDMC <span>eBPF Cryptojacking Detection</span></h1>
  <div id="daemon-status">
    <div id="status-dot"></div>
    <span id="status-text">Connecting…</span>
    <span id="uptime-text"></span>
  </div>
</header>

<nav>
  <button class="active" data-panel="dashboard">Dashboard</button>
  <button data-panel="processes">Processes</button>
  <button data-panel="alerts">Alerts <span id="alert-badge"></span></button>
  <button data-panel="config">Config</button>
</nav>

<main>

  <!-- Dashboard panel -->
  <section class="panel active" id="panel-dashboard">
    <div class="stats-row">
      <div class="stat-card ok">
        <div class="label">Tracked Processes</div>
        <div class="value" id="stat-tracked">—</div>
      </div>
      <div class="stat-card medium">
        <div class="label">Suspicious</div>
        <div class="value" id="stat-suspicious">—</div>
      </div>
      <div class="stat-card high">
        <div class="label">High / Critical</div>
        <div class="value" id="stat-high">—</div>
      </div>
      <div class="stat-card critical">
        <div class="label">Total Alerts</div>
        <div class="value" id="stat-alerts">—</div>
      </div>
    </div>

    <!-- Top suspicious processes -->
    <div class="table-wrap" style="max-height: 320px; overflow-y: auto;">
      <table>
        <thead>
          <tr>
            <th>PID</th><th>Name</th><th>Score</th>
            <th>Confidence</th><th>Mitigation</th><th>Reasons</th>
          </tr>
        </thead>
        <tbody id="dashboard-tbody"></tbody>
      </table>
    </div>

    <!-- Recent alerts -->
    <div id="recent-alerts" class="alert-list"></div>
  </section>

  <!-- All processes panel -->
  <section class="panel" id="panel-processes">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>PID</th><th>Name</th><th>Score</th>
            <th>Confidence</th><th>Mitigation</th>
            <th>Threads</th><th>CPU%</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="processes-tbody"></tbody>
      </table>
    </div>
  </section>

  <!-- Alerts panel -->
  <section class="panel" id="panel-alerts">
    <div id="alerts-list" class="alert-list"></div>
  </section>

  <!-- Config panel -->
  <section class="panel" id="panel-config">
    <div class="config-block">
      <pre id="config-pre">Loading…</pre>
    </div>
  </section>

</main>

<footer>
  <span>EDDMC v1.0 — MSc Research Artifact, IIT / University of Westminster</span>
  <span id="footer-time"></span>
</footer>

<script src="index.js"></script>
</body>
</html>
